# Mirrors manifests/overlays/openshift/ -- CRC MicroShift local OpenShift.
# Extends base values.yaml directly (does NOT layer on values-dev.yaml),
# same as the openshift Kustomize overlay lists `../../base` as its only
# resource, not `../dev`.
#
# Images are built locally and loaded straight into the CRC VM's container
# storage (see justfile push-images-to-crc), so they're referenced as
# localhost/copr-* with imagePullPolicy: Never, same as today.

images:
  registry: "localhost/"
  pullPolicy: Never

openshift:
  enabled: true
  builderProvisioning: k8s
  distgitHostname: copr-distgit-copr.apps.crc.testing

serviceUrls:
  publicHostname: copr-frontend-copr.apps.crc.testing
  publicBaseUrl: http://copr-frontend-copr.apps.crc.testing
  backendBaseUrl: http://copr-backend-copr.apps.crc.testing
  resallocUrl: http://copr-resalloc-copr.apps.crc.testing
  distgitBaseUrl: http://copr-distgit-copr.apps.crc.testing

resalloc:
  # Fully replaces the base "local_x86_64" pool (podman provisioning scripts)
  # with the "openshift_x86_64" pool (oc-run-based provisioning scripts),
  # same as the openshift overlay's patch-resalloc.yaml fully replaces the
  # ConfigMap's data.
  poolsYaml: |
    openshift_x86_64:
      max: 24
      max_starting: 24
      max_prealloc: 0

      tags:
        - arch_noarch
        - arch_x86_64
        - arch_x86_64_native
        - arch_x86_64_v2
        - arch_x86_64_v2_native
        - arch_aarch64
        - arch_aarch64_emulated
        - arch_ppc64le
        - arch_ppc64le_emulated
        - arch_i386
        - arch_i386_native
        - arch_i586
        - arch_i586_native
        - arch_i686
        - arch_i686_native
        - arch_armhfp
        - arch_armhfp_emulated
        - arch_s390x
        - arch_s390x_emulated

      tags_on_demand:
        - copr_builder

      cmd_new: "/home/resalloc/provision/k8s-new"
      cmd_delete: "/home/resalloc/provision/k8s-delete"

      livecheck_period: 180
      reuse_opportunity_time: 0
      reuse_max_count: 0
      reuse_max_time: 0
