---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-resalloc
  namespace: {{ include "copr.namespace" . }}
  labels:
    {{- include "copr.labels" . | nindent 4 }}
    component: resalloc
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: resalloc
  template:
    metadata:
      labels:
        {{- include "copr.labels" . | nindent 8 }}
        component: resalloc
    spec:
      {{- if eq .Values.openshift.builderProvisioning "k8s" }}
      serviceAccountName: copr-builder-sa
      {{- end }}
      containers:
        - name: resalloc
          image: {{ include "copr.image" (dict "root" $ "component" "resalloc") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - /bin/bash
            - "-c"
            - "cd $(rpm -ql resalloc-server |grep alembic.ini |xargs dirname) && alembic-3 upgrade head && /usr/bin/resalloc-server"
          {{- if eq .Values.openshift.builderProvisioning "podman" }}
          securityContext:
            seLinuxOptions:
              type: "spc_t"
            runAsUser: 0
          {{- end }}
          ports:
            - containerPort: 49100
              protocol: TCP
          env:
            {{- if eq .Values.openshift.builderProvisioning "podman" }}
            - name: CONTAINER_HOST
              value: "unix:///run/podman/podman.sock"
            - name: COPR_PODMAN_NETWORK
              value: "copr"
            - name: COPR_SSH_DIR
              value: {{ .Values.dev.sshDir | quote }}
            {{- end }}
            - name: BUILDER_IMAGE
              value: {{ include "copr.image" (dict "root" $ "component" "builder") }}
          volumeMounts:
            - name: resalloc-data
              mountPath: /persistent
            - name: resalloc-config
              mountPath: /etc/resallocserver/pools.yaml
              subPath: pools.yaml
            {{- if eq .Values.openshift.builderProvisioning "podman" }}
            - name: podman-socket
              mountPath: /run/podman/podman.sock
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: 49100
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 49100
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: "512Mi"
              cpu: "200m"
            requests:
              memory: "160Mi"
              cpu: "120m"

        # Resalloc WebUI (optional, for debugging/monitoring)
        - name: resalloc-webui
          image: {{ include "copr.image" (dict "root" $ "component" "resalloc") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - python3
            - "-c"
            - "from resallocwebui.app import app; app.run(host='0.0.0.0', port=5007)"
          ports:
            - containerPort: 5007
              {{- if .Values.dev.enabled }}
              hostPort: 5007
              {{- end }}
              protocol: TCP
          volumeMounts:
            - name: resalloc-data
              mountPath: /persistent
            - name: resalloc-config
              mountPath: /etc/resallocserver/pools.yaml
              subPath: pools.yaml
          livenessProbe:
            tcpSocket:
              port: 5007
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 5007
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "80Mi"
              cpu: "60m"

      volumes:
        - name: resalloc-config
          configMap:
            name: copr-resalloc-config
        - name: resalloc-data
          persistentVolumeClaim:
            claimName: copr-resalloc-data
        {{- if eq .Values.openshift.builderProvisioning "podman" }}
        - name: podman-socket
          hostPath:
            path: {{ .Values.dev.podmanSocketPath }}
            type: File
        {{- end }}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: resalloc
  namespace: {{ include "copr.namespace" . }}
  labels:
    {{- include "copr.labels" . | nindent 4 }}
spec:
  selector:
    component: resalloc
  ports:
    - name: server
      port: 49100
      targetPort: 49100
      protocol: TCP
    - name: webui
      port: 5007
      targetPort: 5007
      protocol: TCP
