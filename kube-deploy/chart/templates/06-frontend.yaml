---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-frontend
  namespace: {{ include "copr.namespace" . }}
  labels:
    {{- include "copr.labels" . | nindent 4 }}
    component: frontend
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: frontend
  template:
    metadata:
      labels:
        {{- include "copr.labels" . | nindent 8 }}
        component: frontend
    spec:
      {{- if .Values.openshift.enabled }}
      serviceAccountName: copr-anyuid
      {{- end }}
      initContainers:
        - name: wait-database
          image: {{ include "copr.image" (dict "root" $ "component" "frontend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            [
              "sh",
              "-c",
              "until nc -z database 5432; do echo 'waiting for database'; sleep 2; done",
            ]
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
            requests:
              memory: "32Mi"
              cpu: "50m"
        - name: wait-redis
          image: {{ include "copr.image" (dict "root" $ "component" "frontend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            [
              "sh",
              "-c",
              "until nc -z redis 6379; do echo 'waiting for redis'; sleep 2; done",
            ]
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
            requests:
              memory: "32Mi"
              cpu: "50m"
        - name: frontend-init
          image: {{ include "copr.image" (dict "root" $ "component" "frontend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - /usr/bin/tini
            - "--"
            - /frontend-init
          env:
            - name: COPR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: copr-frontend-secrets
                  key: secret-key
            - name: COPR_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copr-frontend-secrets
                  key: backend-password
            - name: COPR_DB_USER
              valueFrom:
                secretKeyRef:
                  name: copr-database-secrets
                  key: username
            - name: COPR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copr-database-secrets
                  key: password
            - name: COPR_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: copr-database-secrets
                  key: database
            {{- if .Values.devLocal.enabled }}
            - name: PYTHONPATH
              value: "/opt/copr/frontend/coprs_frontend:/opt/copr/common"
            {{- end }}
          volumeMounts:
            - name: frontend-config
              mountPath: /etc/copr/copr.conf
              subPath: copr.conf
            {{- if .Values.devLocal.enabled }}
            - name: copr-source
              mountPath: /opt/copr
            {{- end }}
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "320Mi"
              cpu: "300m"
      containers:
        - name: frontend
          image: {{ include "copr.image" (dict "root" $ "component" "frontend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- if .Values.devLocal.enabled }}
          command:
            - bash
            - -c
            - |
              rm -rf /usr/share/copr/coprs_frontend/coprs
              ln -s /opt/copr/frontend/coprs_frontend/coprs /usr/share/copr/coprs_frontend/coprs
              ln -sf /opt/copr/common/copr_common /usr/share/copr/coprs_frontend/copr_common
              exec httpd -DFOREGROUND
          {{- end }}
          ports:
            - containerPort: 5000
              {{- if .Values.dev.enabled }}
              hostPort: 5000
              {{- end }}
              protocol: TCP
          env:
            - name: COPR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: copr-frontend-secrets
                  key: secret-key
            - name: COPR_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copr-frontend-secrets
                  key: backend-password
            - name: COPR_DB_USER
              valueFrom:
                secretKeyRef:
                  name: copr-database-secrets
                  key: username
            - name: COPR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copr-database-secrets
                  key: password
            - name: COPR_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: copr-database-secrets
                  key: database
            - name: PUBLIC_COPR_HOSTNAME
              value: {{ .Values.serviceUrls.publicHostname | quote }}
            - name: PUBLIC_COPR_BASE_URL
              value: {{ .Values.serviceUrls.publicBaseUrl | quote }}
            - name: BACKEND_BASE_URL
              value: {{ .Values.serviceUrls.backendBaseUrl | quote }}
            - name: RESALLOC_URL
              value: {{ .Values.serviceUrls.resallocUrl | quote }}
            - name: DISTGIT_BASE_URL
              value: {{ .Values.serviceUrls.distgitBaseUrl | quote }}
            {{- if .Values.devLocal.enabled }}
            - name: PYTHONPATH
              value: "/opt/copr/frontend/coprs_frontend:/opt/copr/common"
            {{- end }}
          volumeMounts:
            - name: frontend-config
              mountPath: /etc/copr/copr.conf
              subPath: copr.conf
            {{- if .Values.devLocal.enabled }}
            - name: copr-source
              mountPath: /opt/copr
            {{- end }}
          startupProbe:
            httpGet:
              path: /
              port: 5000
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "640Mi"
              cpu: "600m"
      volumes:
        - name: frontend-config
          configMap:
            name: copr-frontend-config
        {{- if .Values.devLocal.enabled }}
        - name: copr-source
          hostPath:
            path: {{ .Values.devLocal.sourcePath }}
            type: Directory
        {{- end }}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ include "copr.namespace" . }}
  labels:
    {{- include "copr.labels" . | nindent 4 }}
spec:
  selector:
    component: frontend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
