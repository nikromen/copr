# openshift-local sets imagePullPolicy: Never everywhere, because its images
# are loaded straight into the CRC VM's local container storage. On a real
# cluster the images actually live in a registry, so switch to IfNotPresent.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-frontend
spec:
  template:
    spec:
      $patch: merge
      initContainers:
        - name: wait-database
          imagePullPolicy: IfNotPresent
        - name: wait-redis
          imagePullPolicy: IfNotPresent
        - name: frontend-init
          imagePullPolicy: IfNotPresent
      containers:
        - name: frontend
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-backend
spec:
  template:
    spec:
      initContainers:
        - name: wait-redis
          imagePullPolicy: IfNotPresent
        - name: wait-resalloc
          imagePullPolicy: IfNotPresent
        - name: render-config
          imagePullPolicy: IfNotPresent
      containers:
        - name: backend-log
          imagePullPolicy: IfNotPresent
        - name: backend-build
          imagePullPolicy: IfNotPresent
        - name: backend-action
          imagePullPolicy: IfNotPresent
        - name: backend-httpd
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-distgit
spec:
  template:
    spec:
      initContainers:
        - name: wait-frontend
          imagePullPolicy: IfNotPresent
        - name: render-config
          imagePullPolicy: IfNotPresent
      containers:
        - name: distgit
          imagePullPolicy: IfNotPresent
        - name: distgit-httpd
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-keygen
spec:
  template:
    spec:
      containers:
        - name: keygen-signd
          imagePullPolicy: IfNotPresent
        - name: keygen-httpd
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-database
spec:
  template:
    spec:
      containers:
        - name: database
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-redis
spec:
  template:
    spec:
      containers:
        - name: redis
          imagePullPolicy: IfNotPresent
---
# Also override BUILDER_IMAGE here: openshift-local/patch-resalloc.yaml
# hardcodes it to "localhost/copr-builder:latest" as a plain env var string,
# which the `images:` transformer above can't rewrite (it only touches
# spec.containers[].image, not arbitrary env values). Resalloc's k8s-new
# provisioning script reads this to spawn builder pods, so it must point at
# the same registry the other images were pushed to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-resalloc
spec:
  template:
    spec:
      containers:
        - name: resalloc
          imagePullPolicy: IfNotPresent
          env:
            - name: BUILDER_IMAGE
              value: "REPLACE_COPR_REGISTRY/copr-builder:latest"
        - name: resalloc-webui
          imagePullPolicy: IfNotPresent
